# ─── auth-service: Deployment + ClusterIP Service ────────────────────────────
# Stateless JWT issuer — can run anywhere, no PVC needed.
# Accessed only inside the cluster via DNS: http://auth-service:5001
#
# DOCKER DESKTOP FIXES:
#   - image: shardvault-auth-service  (locally built, no registry host)
#   - imagePullPolicy: Never          (never try to pull from internet)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: shardvault
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: shardvault-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shardvault-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: shardvault
spec:
  selector:
    app: auth-service
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP
