# ─── metadata-db: StatefulSet + PVC + ClusterIP Service ─────────────────────
# SQLite with WAL mode. StatefulSet guarantees stable storage identity.
# One replica only — SQLite is single-writer. Scale to Postgres if needed later.
# DNS: http://metadata-db:5005  (within cluster)
#
# DOCKER DESKTOP FIXES:
#   - image: shardvault-metadata-db    (locally built, no registry host)
#   - imagePullPolicy: Never           (never try to pull from internet)
#   - storageClassName: hostpath       (Docker Desktop default StorageClass)
#   - nodeAffinity: removed master key (Docker Desktop node has no master label)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: metadata-db
  namespace: shardvault
  labels:
    app: metadata-db
spec:
  serviceName: metadata-db
  replicas: 1
  selector:
    matchLabels:
      app: metadata-db
  template:
    metadata:
      labels:
        app: metadata-db
    spec:
      # Docker Desktop is single-node so nodeAffinity is omitted entirely —
      # the only available node will be used automatically.
      containers:
        - name: metadata-db
          image: shardvault-metadata-db:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5005
          volumeMounts:
            - name: metadata-storage
              mountPath: /data
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: metadata-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: hostpath   # Docker Desktop built-in StorageClass
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: metadata-db
  namespace: shardvault
spec:
  selector:
    app: metadata-db
  ports:
    - port: 5005
      targetPort: 5005
  type: ClusterIP
