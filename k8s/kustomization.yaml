# Apply all ShardVault manifests in correct dependency order with one command:
#   kubectl apply -k ./k8s/
#
# Order matters: namespace → secret → stateful deps → stateless services
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 01-secret.yaml
  - 02-auth-service.yaml
  - 03-metadata-db.yaml
  - 04-storage-nodes.yaml
  - 05-orchestrator.yaml
  - 06-prometheus.yaml
  - 07-cronjob-integrity.yaml
