# ─── Prometheus: Deployment + ConfigMap + NodePort ───────────────────────────
#
# FIX 2 (AUDIT): Removed broken scrape jobs for orchestrator/auth-service
# that pointed at /health (returns JSON, not Prometheus format).
# Orchestrator now has a real /metrics endpoint.
# auth-service has no metrics endpoint — intentionally excluded.
#
# Storage nodes already export Prometheus metrics via prometheus_client at /metrics.
# Orchestrator now also exports real metrics at /metrics.
# Access Prometheus UI at http://<MASTER_IP>:30090

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: shardvault
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # ── Orchestrator /metrics (real Prometheus exposition format) ──────────
      # Exports: shardvault_uploads_total, shardvault_downloads_total,
      #          shardvault_upload_duration_seconds, shardvault_download_duration_seconds,
      #          shardvault_files_stored_total, shardvault_downloads_xor_recovered
      - job_name: 'orchestrator'
        static_configs:
          - targets: ['orchestrator.shardvault.svc.cluster.local:5000']
        metrics_path: /metrics

      # ── Storage nodes /metrics (real Prometheus exposition format) ─────────
      # Exports: shardvault_shard_writes_total, shardvault_shard_reads_total,
      #          shardvault_shard_deletes_total, shardvault_shard_count,
      #          shardvault_auth_failures_total
      - job_name: 'storage-nodes'
        static_configs:
          - targets:
              - 'storage-node-0.storage-node.shardvault.svc.cluster.local:5002'
              - 'storage-node-1.storage-node.shardvault.svc.cluster.local:5002'
              - 'storage-node-2.storage-node.shardvault.svc.cluster.local:5002'
        metrics_path: /metrics

      # ── Prometheus self-monitoring ─────────────────────────────────────────
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

    # ── Alert rules (examples) ────────────────────────────────────────────────
    # Uncomment to enable alerting (requires Alertmanager setup):
    # rule_files:
    #   - /etc/prometheus/alerts.yml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: shardvault
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: prometheus-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: shardvault
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
  type: NodePort
