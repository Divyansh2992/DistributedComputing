# ─── CronJob: Nightly Shard Integrity Check ───────────────────────────────────
#
# Runs every night at 02:00 UTC.
# Lists all files from metadata-db, fetches each shard, verifies SHA-256 hash.
# Logs any corruption to stdout — scrape with: kubectl logs -n shardvault -l job-name=integrity-check

apiVersion: batch/v1
kind: CronJob
metadata:
  name: integrity-check
  namespace: shardvault
spec:
  schedule: "0 2 * * *"    # 02:00 UTC every day
  concurrencyPolicy: Forbid  # don't run if previous job is still running
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: integrity-checker
              image: python:3.11-slim
              command: ["python", "-c"]
              args:
                - |
                  import requests, base64, hashlib, json, sys

                  META_URL  = "http://metadata-db.shardvault.svc.cluster.local:5005"
                  AUTH_URL  = "http://auth-service.shardvault.svc.cluster.local:5001"
                  JWT_SECRET = "shard_secret_key_2024_distributed"

                  # Get token
                  token = requests.post(f"{AUTH_URL}/token", timeout=5).json()["token"]
                  hdrs  = {"Authorization": f"Bearer {token}"}

                  # Get all files
                  files = requests.get(f"{META_URL}/files", timeout=10).json()
                  print(f"[INTEGRITY] Checking {len(files)} files...")

                  errors = 0
                  for f in files:
                      for shard in f["shards"]:
                          try:
                              r = requests.get(
                                  f'{shard["node_url"]}/shards/{shard["shard_id"]}',
                                  headers=hdrs, timeout=5
                              )
                              if r.status_code != 200:
                                  print(f"[MISSING] file={f['file_id']} shard={shard['shard_id']} node={shard['node_name']}")
                                  errors += 1
                                  continue
                              data      = base64.b64decode(r.json()["data"])
                              calc_hash = hashlib.sha256(data).hexdigest()
                              if calc_hash != shard["hash"]:
                                  print(f"[CORRUPT] file={f['file_id']} shard={shard['shard_id']} node={shard['node_name']}")
                                  errors += 1
                              else:
                                  print(f"[OK] shard={shard['shard_id']}")
                          except Exception as e:
                              print(f"[ERROR] shard={shard['shard_id']}: {e}")
                              errors += 1

                  print(f"[INTEGRITY] Done. Total errors: {errors}")
                  sys.exit(1 if errors > 0 else 0)
              env:
                - name: JWT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: shardvault-secrets
                      key: JWT_SECRET
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
