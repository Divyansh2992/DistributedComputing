###############################################################
# auth-service.yaml
# Deployment + ClusterIP Service for JWT auth_service
# Scheduled on: Machine A (master), label: laptop=laptop-a
###############################################################

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: distributed-storage
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      # 2-LAPTOP MODE: auth-service runs on Machine A (alongside orchestrator)
      nodeSelector:
        laptop: "laptop-a"
      containers:
        - name: auth-service
          image: REGISTRY_IP:5050/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shard-secret
                  key: JWT_SECRET
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: distributed-storage
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
  type: ClusterIP
