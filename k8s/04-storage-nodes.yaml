# ─── storage-nodes: StatefulSet (3 replicas) + Headless Service + PVC ────────
#
# CRITICAL design decisions:
#   1. Headless Service → each pod gets a stable DNS name:
#        storage-node-0.storage-node.shardvault.svc.cluster.local
#        storage-node-1.storage-node.shardvault.svc.cluster.local
#        storage-node-2.storage-node.shardvault.svc.cluster.local
#   2. podAntiAffinity → PREFERRED (not required) — works on single-node cluster
#      On Docker Desktop there is only 1 physical node, so "required" would
#      permanently Pending all 3 pods. "preferred" allows co-location gracefully.
#   3. volumeClaimTemplates → each pod gets its own 10Gi PVC (separate virtual disk)
#   4. NODE_NAME env var → human-readable name (storage-node-0, -1, -2)
#
# DOCKER DESKTOP FIXES:
#   - image: shardvault-storage-node   (locally built, no registry host)
#   - imagePullPolicy: Never           (never try to pull from internet)
#   - podAntiAffinity changed to preferredDuringSchedulingIgnoredDuringExecution
#   - storageClassName: hostpath       (Docker Desktop built-in StorageClass)
#
# This replaces node_a, node_b, node_c containers from docker-compose.yml

# Headless Service for stable pod DNS names
apiVersion: v1
kind: Service
metadata:
  name: storage-node
  namespace: shardvault
  labels:
    app: storage-node
spec:
  clusterIP: None          # headless — no load balancing, direct pod DNS
  selector:
    app: storage-node
  ports:
    - port: 5002
      targetPort: 5002
      name: http
---
# NodePort Service for direct external access to individual nodes (debugging)
apiVersion: v1
kind: Service
metadata:
  name: storage-node-lb
  namespace: shardvault
  labels:
    app: storage-node
spec:
  selector:
    app: storage-node
  ports:
    - port: 5002
      targetPort: 5002
      nodePort: 30002
  type: NodePort
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-node
  namespace: shardvault
  labels:
    app: storage-node
spec:
  serviceName: storage-node   # must match headless Service name above
  replicas: 3
  selector:
    matchLabels:
      app: storage-node
  # Pod Management: Parallel — all nodes start at the same time (not sequentially)
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: storage-node
    spec:
      # SINGLE-NODE COMPATIBLE: Use preferred (soft) anti-affinity instead of
      # required (hard). On Docker Desktop, all 3 replicas land on the same
      # physical node but remain logically isolated via separate PVCs and ports.
      # On a real multi-node cluster this hint still helps spread pods across nodes.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - storage-node
                topologyKey: kubernetes.io/hostname
      containers:
        - name: storage-node
          image: shardvault-storage-node:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5002
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shardvault-secrets
                  key: JWT_SECRET
            # NODE_NAME is derived from the pod's own hostname (storage-node-0, -1, -2)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name   # will be "storage-node-0" etc.
            - name: PORT
              value: "5002"
          volumeMounts:
            - name: shard-storage
              mountPath: /data/shards
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
  # Each replica gets its own PVC on Docker Desktop's hostpath storage
  volumeClaimTemplates:
    - metadata:
        name: shard-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: hostpath   # Docker Desktop built-in StorageClass
        resources:
          requests:
            storage: 10Gi
