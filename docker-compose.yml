# ==============================================================
#  ShardVault — docker-compose.yml  (PC 1 — MASTER)
#  ══════════════════════════════════════════════════════════════
#  Run on PC 1:  docker compose up --build
# ==============================================================

services:

  # ── Auth Service ─────────────────────────────────────────────
  auth_service:
    build: ./auth_service
    container_name: auth_service
    ports:
      - "5001:5001"
    environment:
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - auth_data:/data          # persist user accounts across restarts
    restart: unless-stopped

  # ── Metadata Database (SQLite) ───────────────────────────────
  metadata_db:
    build: ./metadata_db
    container_name: metadata_db
    ports:
      - "5005:5005"
    environment:
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - meta_data:/data
    restart: unless-stopped

  # ── Orchestrator (+ UI) ──────────────────────────────────────
  orchestrator:
    build: ./orchestrator
    container_name: orchestrator
    ports:
      - "5000:5000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_URL=http://auth_service:5001
      - META_URL=http://metadata_db:5005
      - NODE_A_URL=${NODE_A_URL}
      - NODE_B_URL=${NODE_B_URL}
      - NODE_C_URL=${NODE_C_URL}
    depends_on:
      - auth_service
      - metadata_db
    restart: unless-stopped

volumes:
  auth_data:
  meta_data:
